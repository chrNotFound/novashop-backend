spring.application.name=novashop-backend
server.port=${PORT:8080}

# Base de datos MySQL (se puede sobrescribir con variables de entorno)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/novashop?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT: en producción define JWT_SECRET con al menos 32 caracteres
novashop.jwt.secret=${JWT_SECRET:una-clave-larga-de-minimo-32-caracteres-para-novashop-2026}
novashop.jwt.access-minutes=15
novashop.jwt.refresh-days=7
novashop.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Swagger UI en /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
